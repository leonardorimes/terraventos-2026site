name: Atualizar Blog

on:
  schedule:
    - cron: '0 12 */2 * *'  # A cada 2 dias às 9h Brasília (12h UTC)
  workflow_dispatch:          # Permite disparo manual

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install feedparser

      - name: Executar script de atualização
        run: python .github/scripts/update_blog.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Nada a commitar." || (
            git add src/components/BlogSection.tsx &&
            git commit -m "chore: atualizar postagens do blog" &&
            git push
          )
